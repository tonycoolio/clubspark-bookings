[project]
name = "clubspark-bookings"
version = "0.1.0"
description = "Check court availability (and later book) on ClubSpark with Playwright."
requires-python = ">=3.11"
dependencies = ["playwright==1.63.0"]

[project.scripts]
clubspark = "clubspark_bookings.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
